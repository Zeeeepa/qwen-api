[pytest]
# Pytest configuration for qwen-api test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use mocks)
    e2e: End-to-end tests (require running server)
    slow: Slow tests (may take >1s)
    auth: Tests that require authentication

# Output options
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    
# Asyncio mode
asyncio_mode = auto

# Coverage options (when using --cov)
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

